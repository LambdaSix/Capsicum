name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Capsicum.sln
      - run: dotnet build Capsicum.sln --configuration Release --no-restore
      - run: dotnet test Capsicum.sln --configuration Release --no-build
